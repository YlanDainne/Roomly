server.port=8080
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
spring.web.resources.add-mappings=false

# PostgreSQL / Supabase Database Configuration
spring.datasource.url=${SUPABASE_DB_URL:jdbc:postgresql://db.klhgcqoypnxkqnrnbesz.supabase.co:5432/postgres?sslmode=require}
spring.datasource.username=${SUPABASE_DB_USER:postgres}
spring.datasource.password=${SUPABASE_DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.data-source-properties.prepareThreshold=0
spring.datasource.hikari.data-source-properties.preferQueryMode=simple

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Supabase Configuration
supabase.url=${SUPABASE_PROJECT_URL:https://klhgcqoypnxkqnrnbesz.supabase.co}
supabase.api-key=${SUPABASE_API_KEY:}
supabase.storage.api-key=${SUPABASE_STORAGE_API_KEY:${SUPABASE_API_KEY:}}
supabase.storage.bucket-name=${SUPABASE_STORAGE_BUCKET:roomly-images}
supabase.jwt-secret=${JWT_SECRET:}
